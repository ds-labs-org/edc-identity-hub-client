[package]
name = "edc-identity-hub-client"
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"
description= "A Rust client for EDC Identity Hub"
repository = "https://github.com/dataspace-rs/edc-identity-hub-client"
keywords = ["dataspace", "http"]
categories = []
readme = "README.md"

[features]
management = []

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
clap = { version = "4.6.3", features = ["derive", "env"] }
reqwest = { workspace = true, features = ["form"] }
tokio = { version = "1.53.1", features = ["full"] }
# HTTP contract tests for every client method against mocked v1alpha/v1beta
# responses -- runs a real (native-only) hyper server, hence the same
# wasm32 gate as tokio/clap above.
wiremock = "0.6"

[workspace.dependencies]
reqwest = { version = "0.13", features = ["json"]}
